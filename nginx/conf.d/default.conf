# Official Docs: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# Version: nginx 1.28.2 (stable, 2026-06-01) — https://hub.docker.com/_/nginx
# http2 on: nginx 1.25.1+ 공식 방식 (listen ... http2 deprecated)
# Domain: xn--2e0bj1fruw33b6ti.net (구찌야놀자.net)

# ─── HTTP → HTTPS 리다이렉트 ─────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name xn--2e0bj1fruw33b6ti.net www.xn--2e0bj1fruw33b6ti.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS 메인 서버 ─────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--2e0bj1fruw33b6ti.net www.xn--2e0bj1fruw33b6ti.net;

    # SSL 인증서 (Certbot)
    ssl_certificate     /etc/letsencrypt/live/xn--2e0bj1fruw33b6ti.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--2e0bj1fruw33b6ti.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' wss: https://accounts.google.com; frame-src https://accounts.google.com;" always;

    # ─── Auth 엔드포인트 (Rate Limit 강화) ───────────────────────────────────
    # NOTE: /api/auth/ 는 /api/ 보다 먼저 선언해야 nginx prefix 매칭에서 올바르게 적용됨
    # Official: https://nginx.org/en/docs/http/ngx_http_core_module.html#location
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── API 프록시 ──────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ─── WebSocket (Socket.io) ───────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
    }

    # ─── Frontend (Next.js) ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ─── 정적 파일 캐시 ──────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
