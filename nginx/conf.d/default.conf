# nginx → Apache2 전환 완료 (2026-06-01)
# VPS 웹서버: Apache2 (host-native, nginx purged)
#
# 아래는 원래 nginx 설정과 동등한 Apache2 .htaccess / vhost 매핑입니다:
#
# nginx proxy_pass http://frontend:3000  → Apache mod_proxy (필요 시)
# nginx proxy_pass http://backend:3001   → Apache mod_proxy (필요 시)
# nginx rate limiting                    → Apache mod_ratelimit / mod_evasive
# nginx SSL                              → Apache mod_ssl + Let's Encrypt
# nginx gzip                             → Apache mod_deflate (.htaccess)
# nginx security headers                 → Apache mod_headers (.htaccess)
# nginx static cache                     → Apache mod_expires (.htaccess)
#
# 실제 설정 파일:
#   /var/www/xn--2e0bj1fruw33b6ti.net/public/.htaccess  (압축, 캐시, 보안헤더, 리다이렉트)
#   /etc/apache2/sites-enabled/*.conf                    (VirtualHost 설정)
