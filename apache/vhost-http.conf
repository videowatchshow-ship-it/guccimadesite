# Apache2 VirtualHost — HTTP :80
# Domain: xn--2e0bj1fruw33b6ti.net (구찌야놀자.net)
# 이 파일은 VPS /etc/apache2/sites-enabled/000-xn--2e0bj1fruw33b6ti.net.conf 와 동기화됨
# ref: https://httpd.apache.org/docs/2.4/vhosts/

<VirtualHost *:80>
    ServerName xn--2e0bj1fruw33b6ti.net
    ServerAlias www.xn--2e0bj1fruw33b6ti.net
    DocumentRoot /var/www/xn--2e0bj1fruw33b6ti.net/public

    <Directory /var/www/xn--2e0bj1fruw33b6ti.net/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # HTTP → HTTPS 강제 리다이렉트
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/xn--2e0bj1fruw33b6ti.net_error.log
    CustomLog ${APACHE_LOG_DIR}/xn--2e0bj1fruw33b6ti.net_access.log combined
</VirtualHost>
