# Apache2 VirtualHost — HTTPS :443
# Domain: xn--2e0bj1fruw33b6ti.net (구찌야놀자.net)
# 이 파일은 VPS /etc/apache2/sites-enabled/000-xn--2e0bj1fruw33b6ti.net-le-ssl.conf 와 동기화됨
# ref: https://httpd.apache.org/docs/2.4/mod/mod_ssl.html

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName xn--2e0bj1fruw33b6ti.net
    ServerAlias www.xn--2e0bj1fruw33b6ti.net
    DocumentRoot /var/www/xn--2e0bj1fruw33b6ti.net/public

    <Directory /var/www/xn--2e0bj1fruw33b6ti.net/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # SSL — Let's Encrypt (certbot)
    # ref: https://certbot.eff.org/docs/
    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/xn--2e0bj1fruw33b6ti.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/xn--2e0bj1fruw33b6ti.net/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/xn--2e0bj1fruw33b6ti.net_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/xn--2e0bj1fruw33b6ti.net_ssl_access.log combined
</VirtualHost>
</IfModule>
