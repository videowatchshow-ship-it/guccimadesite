# Apache2 .htaccess 참조 파일
# 이 파일의 실제 배포 위치: /var/www/xn--2e0bj1fruw33b6ti.net/public/.htaccess
# ref: https://httpd.apache.org/docs/2.4/howto/htaccess.html

Options -Indexes
DirectoryIndex index.php index.html

# ── HTTPS 강제 리다이렉트
# ref: https://httpd.apache.org/docs/2.4/rewrite/remapping.html
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    # www → non-www
    RewriteCond %{HTTP_HOST} ^www\.(.+)$ [NC]
    RewriteRule ^ https://%1%{REQUEST_URI} [L,R=301]

    # /mobile/ → / (301 — 반응형 통합)
    RewriteRule ^mobile/?$ / [L,R=301]
    RewriteRule ^mobile/(.*)$ /$1 [L,R=301]
</IfModule>

# ── gzip 압축
# ref: https://httpd.apache.org/docs/2.4/mod/mod_deflate.html
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript
    AddOutputFilterByType DEFLATE text/xml application/json text/plain
    AddOutputFilterByType DEFLATE image/svg+xml font/woff2
</IfModule>

# ── 캐시 헤더
# ref: https://httpd.apache.org/docs/2.4/mod/mod_expires.html
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/html             "access plus 0 seconds"
    ExpiresByType text/css              "access plus 1 year"
    ExpiresByType application/javascript "access plus 1 year"
    ExpiresByType image/webp            "access plus 1 year"
    ExpiresByType image/png             "access plus 1 year"
    ExpiresByType image/jpeg            "access plus 1 year"
    ExpiresByType font/woff2            "access plus 1 year"
</IfModule>

# ── 보안 헤더
# ref: https://owasp.org/www-project-secure-headers/
<IfModule mod_headers.c>
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
    Header always unset X-Powered-By
    Header always unset Server

    <FilesMatch "\.(css|js|woff2)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    <FilesMatch "\.(jpg|jpeg|png|gif|webp|svg|ico)$">
        Header set Cache-Control "public, max-age=31536000"
    </FilesMatch>
    <FilesMatch "\.(php|html?)$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires "0"
    </FilesMatch>
    Header unset ETag
</IfModule>

# ── ETag 비활성화
FileETag None

# ── 민감 파일 접근 차단
<FilesMatch "^\.(env|git|htpasswd|bak|backup|log|sql)">
    Require all denied
</FilesMatch>
<FilesMatch "\.(bak|backup|log|sql|tar|gz|zip)$">
    Require all denied
</FilesMatch>
