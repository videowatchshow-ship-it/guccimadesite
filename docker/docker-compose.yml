# Official Docs: https://docs.docker.com/compose/
# Official GitHub: https://github.com/docker/compose
# Version: Docker Compose v2 (2026-06-01)
# Regex Validation: ^[0-9]+\.[0-9]+\.[0-9]+$
# Versions verified (2026-06-01):
#   node:22.22.3-alpine3.22  — https://hub.docker.com/_/node
#   mariadb:11.4.11          — https://hub.docker.com/_/mariadb (LTS)
#   redis:8.0.4-alpine       — https://hub.docker.com/_/redis (GA 2026-04)
#   nginx:1.30.1-alpine      — https://hub.docker.com/_/nginx (stable, 2026-05-13)

services:
  # ─── Frontend: Next.js 16.2.6 ───────────────────────────────────────────────
  # Official: https://nextjs.org/docs/app/building-your-application/deploying
  # Node.js base: 22.22.3-alpine3.22 — https://hub.docker.com/_/node (LTS)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gucci-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:3001}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://backend:3001}
      - NEXT_PUBLIC_DOMAIN=${NEXT_PUBLIC_DOMAIN:-xn--2e0bj1fruw33b6ti.net}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - gucci-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Backend: Node.js 22 LTS + Express 5.2.1 ────────────────────────────────
  # Official: https://expressjs.com/en/5x/api.html
  # Node.js base: 22.22.3-alpine3.22 — https://hub.docker.com/_/node (LTS)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gucci-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-guccimadesite}
      - DB_USER=${DB_USER:-gucci}
      - DB_PASS=${DB_PASS}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASS=${REDIS_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - DOMAIN=${DOMAIN:-xn--2e0bj1fruw33b6ti.net}
    ports:
      - "3001:3001"
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gucci-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─── MariaDB 11.4 LTS ────────────────────────────────────────────────────────
  # Official: https://mariadb.com/docs/server/ref/mdb/
  # Version: 11.4.11 (LTS, 2026-06-01) — https://hub.docker.com/_/mariadb
  mariadb:
    image: mariadb:11.4.11
    container_name: gucci-mariadb
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=${DB_ROOT_PASS}
      - MARIADB_DATABASE=${DB_NAME:-guccimadesite}
      - MARIADB_USER=${DB_USER:-gucci}
      - MARIADB_PASSWORD=${DB_PASS}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --log-error=/var/log/mysql/error.log
      --general-log=1
      --general-log-file=/var/log/mysql/general.log
      --slow-query-log=1
      --slow-query-log-file=/var/log/mysql/slow-query.log
      --long-query-time=2
      --log-bin=/var/log/mysql/mysql-bin
      --binlog-format=ROW
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mariadb-logs:/var/log/mysql
    networks:
      - gucci-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Redis 8.0 GA ────────────────────────────────────────────────────────────
  # Official: https://redis.io/docs/latest/operate/oss_and_stack/
  # Version: 8.0.4-alpine (GA, 2026-04) — https://hub.docker.com/_/redis
  redis:
    image: redis:8.0.4-alpine
    container_name: gucci-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASS}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --rename-command FLUSHDB ""
      --rename-command FLUSHALL ""
      --rename-command KEYS ""
      --loglevel notice
      --logfile /var/log/redis/redis-server.log
    volumes:
      - redis-data:/data
      - redis-logs:/var/log/redis
    networks:
      - gucci-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── nginx 1.30 Stable ───────────────────────────────────────────────────────
  # Official: https://nginx.org/en/docs/
  # Version: 1.30.1-alpine (stable, 2026-05-13) — https://hub.docker.com/_/nginx
  nginx:
    image: nginx:1.30.1-alpine
    container_name: gucci-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - gucci-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mariadb-data:
    driver: local
  mariadb-logs:
    driver: local
  redis-data:
    driver: local
  redis-logs:
    driver: local
  nginx-logs:
    driver: local

networks:
  gucci-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
